[project]
name = "klinik"
version = "0.1.0"
description = "Nil Psikoloji clinic management: Klinik Web (cloud) + Klinik Kasa (local) + sync worker"
requires-python = ">=3.12"
dependencies = ["klinik-shared", "klinik-cloud", "klinik-local", "klinik-sync"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/shared", "apps/cloud", "apps/local", "apps/sync"]

[tool.uv.sources]
klinik-shared = { workspace = true }
klinik-cloud = { workspace = true }
klinik-local = { workspace = true }
klinik-sync = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.8",
    "pillow>=10",
    "playwright>=1.49",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real PostgreSQL (Docker)",
    "e2e: real browsers against the running dev stack (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/*/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
# RUF001-003: Turkish letters are intentional. S101: asserts are fine in tests.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["klinik_shared", "klinik_cloud", "klinik_local", "klinik_sync"]

[tool.ruff.lint.isort]
known-first-party = ["klinik_shared", "klinik_cloud", "klinik_local", "klinik_sync"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "pywebpush", "pywebpush.*"]
ignore_missing_imports = true
