[project]
name = "klinik"
version = "0.1.0"
description = "Nil Psikoloji clinic management: one office app with admin and therapist roles"
requires-python = ">=3.12"
dependencies = ["klinik-shared", "klinik-local"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/shared", "apps/local"]

[tool.uv.sources]
klinik-shared = { workspace = true }
klinik-local = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.8",
    "pillow>=10",
    "playwright>=1.49",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
    "pypdf>=5",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real PostgreSQL (Docker)",
    "e2e: real browsers against the running dev stack (opt-in)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/*/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
# RUF001-003: Turkish letters are intentional. S101: asserts are fine in tests.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608"]
"scripts/**" = ["S603", "S607", "S101", "E501", "S310", "S311"]
# Batch jobs (no request latency to protect): plain file and process calls are fine.
"apps/local/klinik_local/snapshot.py" = ["ASYNC240"]
# Embeds a JavaScript program as a string.
"tests/integration/test_snapshot.py" = ["E501"]
"apps/local/klinik_local/jobs/**" = ["ASYNC240", "ASYNC221", "S603", "S607"]
# Report layouts: table rows read best one per line.
"apps/local/klinik_local/raporlar/reports.py" = ["E501"]
# Identifiers come from the database catalogue (never from a request), values are bound.
"apps/local/klinik_local/replika/**" = ["S608", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["klinik_shared", "klinik_local"]

[tool.ruff.lint.isort]
known-first-party = ["klinik_shared", "klinik_local"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "pywebpush", "pywebpush.*", "pyrage", "pyrage.*", "reportlab.*"]
ignore_missing_imports = true

# ReportLab has no type information: its classes are subclassed as Any.
[[tool.mypy.overrides]]
module = ["klinik_local.raporlar.*"]
disallow_subclassing_any = false
warn_return_any = false
