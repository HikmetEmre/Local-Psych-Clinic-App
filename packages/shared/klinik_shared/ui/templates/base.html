<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#356650">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}{{ tier.app_name }}{% endblock %} · {{ clinic_name }}</title>
  <link rel="icon" href="/static/ui/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="/static/ui/css/klinik.css">
  {# htmx must not inject its own <style>: the CSP allows stylesheets from this origin only. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <script src="/static/ui/js/htmx.min.js" defer></script>
  {% if user and realtime %}<script src="/static/ui/js/htmx-sse.js" defer></script>{% endif %}
  {% if pwa %}
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/static/ui/js/push.js" defer></script>
  {% endif %}
  {% if user %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  {% block head %}{% endblock %}
</head>
<body{% if user %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% if realtime and not user.must_change_password %} hx-ext="sse" sse-connect="/events"{% endif %}{% endif %}>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/">
        <img class="brand__mark" src="/static/ui/img/mark-96.png" alt="" width="44" height="44">
        <span class="brand__name">{{ clinic_name }}
          <span class="brand__app">{{ tier.app_name }}</span>
        </span>
      </a>
      <span class="tier-badge">{{ tier.badge }}</span>
      {% if user %}
      <div class="user-menu">
        {# Nothing polls in the background until the temporary password is replaced:
           those requests would be redirected to this page and reload it in a loop. #}
        {% if has_inbox and not user.must_change_password %}
        <a class="bell" href="/bildirimler" hx-get="/bildirimler/sayac" hx-trigger="load, sse:notification" hx-swap="innerHTML"><span aria-hidden="true">🔔</span><span class="sr-only">Bildirimler</span></a>
        {% endif %}
        <a class="user-menu__name" href="/hesap/sifre" title="Şifre değiştir">{{ user.display_name }}</a>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn btn--secondary btn--small" type="submit">Çıkış</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  {% if user and nav %}
  <nav class="tabs" aria-label="Sekmeler">
    <div class="tabs__inner">
      {% for item in nav %}
      {% if not item.permission or item.permission in user.permissions %}
      <a href="{{ item.href }}"{% if request.url.path.startswith(item.href) %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endif %}
      {% endfor %}
    </div>
  </nav>
  {% endif %}
  <main class="page{% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">{{ clinic_name }} · {{ tier.app_name }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
