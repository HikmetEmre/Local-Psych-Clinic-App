# LOCAL TIER ("Klinik Kasa"): what runs on the office laptop.
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#
# Security rules encoded here (brief §11):
#   - local-db publishes NO port: it is reachable only inside the compose network.
#   - local-app binds to 127.0.0.1 only (development; the office install serves the LAN over HTTPS).
#   - backup: encrypted with a public key; the private key is kept OFFLINE, not here.

name: klinik

x-app-build: &app-build
  context: ..
  dockerfile: infra/Dockerfile

x-healthcheck: &http-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 10s

services:
  local-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kasa
      POSTGRES_USER: kasa_migrator
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD in the env file}
    volumes:
      - local-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasa_migrator -d kasa"]
      interval: 5s
      timeout: 3s
      retries: 12

  local-migrate:
    build:
      <<: *app-build
      args: { APP: local }
    restart: "no"
    # Migrate, then give the least-privilege roles their passwords.
    command:
      - sh
      - -c
      - alembic -n local upgrade head && python -m klinik_local.manage set-role-passwords
    environment:
      LOCAL_MIGRATION_DATABASE_URL: postgresql+asyncpg://kasa_migrator:${LOCAL_DB_PASSWORD}@local-db:5432/kasa
      LOCAL_APP_DB_PASSWORD: ${LOCAL_APP_DB_PASSWORD:?set LOCAL_APP_DB_PASSWORD in the env file}
      LOCAL_SYNC_DB_PASSWORD: ${LOCAL_SYNC_DB_PASSWORD:?set LOCAL_SYNC_DB_PASSWORD in the env file}
      LOCAL_BACKUP_DB_PASSWORD: ${LOCAL_BACKUP_DB_PASSWORD:?set LOCAL_BACKUP_DB_PASSWORD in the env file}
      LOCAL_FERNET_KEYS: ${LOCAL_FERNET_KEYS:?set LOCAL_FERNET_KEYS in the env file}
      LOCAL_AUTH_FERNET_KEY: ${LOCAL_AUTH_FERNET_KEY:?set LOCAL_AUTH_FERNET_KEY in the env file}
    depends_on:
      local-db: { condition: service_healthy }

  local-app:
    build:
      <<: *app-build
      args: { APP: local }
    restart: unless-stopped
    environment:
      # kasa_app is not the table owner, so row-level security applies to it.
      LOCAL_DATABASE_URL: postgresql+asyncpg://kasa_app:${LOCAL_APP_DB_PASSWORD}@local-db:5432/kasa
      LOCAL_FERNET_KEYS: ${LOCAL_FERNET_KEYS:?set LOCAL_FERNET_KEYS in the env file}
      LOCAL_AUTH_FERNET_KEY: ${LOCAL_AUTH_FERNET_KEY}
      LOCAL_COOKIE_SECURE: ${LOCAL_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      local-migrate: { condition: service_completed_successfully }
    healthcheck: *http-healthcheck

  backup:
    build:
      context: ..
      dockerfile: infra/backup/Dockerfile
    image: klinik-backup
    restart: unless-stopped
    environment:
      PGHOST: local-db
      PGDATABASE: kasa
      PGUSER: kasa_backup
      PGPASSWORD: ${LOCAL_BACKUP_DB_PASSWORD:?set LOCAL_BACKUP_DB_PASSWORD in the env file}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT (age1...) in the env file}
      RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - ${BACKUP_HOST_DIR:-../backups}:/backups
      - ${BACKUP_RCLONE_CONFIG_DIR:-../secrets/rclone}:/config/rclone:ro
    depends_on:
      local-migrate: { condition: service_completed_successfully }

volumes:
  local-db-data:
