[project]
name = "klinik-cloud"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["klinik-shared", "pywebpush>=2.0"]

[tool.uv.sources]
klinik-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klinik_cloud"]
