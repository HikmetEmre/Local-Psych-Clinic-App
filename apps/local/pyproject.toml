[project]
name = "klinik-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "klinik-shared",
    "reportlab>=4.2",
]

[tool.uv.sources]
klinik-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klinik_local"]
